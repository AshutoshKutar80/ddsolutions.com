<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DDSOLUTIONS — Digital Soch. Smart Solutions. Real Growth.</title>
    <meta name="description"
        content="DDSOLUTIONS creates modern websites and smart digital solutions for growing businesses. Based in Kanpur, Uttar Pradesh." />
    <link rel="icon" type="image/png" href="ddfevi.png" />
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #070a14;
            --s: #0f1527;
            --s2: #161e36;
            --t: #f2f5ff;
            --m: #9aa5c0;
            --l: rgba(255, 255, 255, .1);
            --a: #8b7cff;
            --b: #2ee6c5;
            --c: #ff6bb5
        }

        [data-theme="light"] {
            --bg: #f5f7fc;
            --s: #fff;
            --s2: #eaeffa;
            --t: #10162b;
            --m: #5d6a87;
            --l: rgba(16, 22, 43, .12);
            --a: #6454f0;
            --b: #00a08c;
            --c: #e0388f
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 70px;
            overflow-x: hidden;
            max-width: 100%
        }

        body {
            font-family: Manrope, "Noto Sans Devanagari", system-ui, sans-serif;
            background: var(--bg);
            color: var(--t);
            line-height: 1.6;
            overflow-x: hidden;
            max-width: 100%;
            transition: background .4s, color .4s
        }

        h1,
        h2,
        h3 {
            font-family: "Space Grotesk", Manrope, "Noto Sans Devanagari", sans-serif;
            line-height: 1.12;
            letter-spacing: -.03em
        }

        a {
            color: inherit;
            text-decoration: none
        }

        p {
            color: var(--m)
        }

        button,
        select {
            font: inherit;
            cursor: pointer
        }

        .wrap {
            width: min(1180px, 92%);
            margin: auto
        }

        .g {
            background: linear-gradient(90deg, var(--a), var(--b), var(--c), var(--a));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: flow 6s linear infinite
        }

        @keyframes flow {
            to {
                background-position: 300% 0
            }
        }

        #bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0;
            background: linear-gradient(90deg, var(--a), var(--b));
            z-index: 99
        }

        #glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle, rgba(139, 124, 255, .22), transparent 65%);
            transform: translate(-50%, -50%);
            left: 50%;
            top: 30%
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 10px max(4%, calc((100% - 1180px)/2));
            background: var(--s);
            border-bottom: 1px solid var(--l)
        }

        .logo {
            font-family: "Space Grotesk", Manrope, system-ui, sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap
        }

        .logo b {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            font-size: .75rem;
            color: #fff;
            background: linear-gradient(135deg, var(--a), var(--b))
        }

        .logo-img {
            height: 34px;
            width: auto;
            display: block;
            object-fit: contain
        }

        .links {
            display: flex;
            gap: 2px;
            align-items: center
        }

        nav a.l {
            font-size: .82rem;
            font-weight: 600;
            color: var(--m);
            padding: 7px 11px;
            border-radius: 99px
        }

        nav a.l:hover {
            background: var(--s2);
            color: var(--t)
        }

        .ctrl {
            display: flex;
            gap: 6px;
            align-items: center
        }

        .sel {
            background: var(--s2);
            color: var(--t);
            border: 1px solid var(--l);
            border-radius: 99px;
            padding: 6px 10px;
            font-size: .78rem;
            font-weight: 700;
            height: 34px
        }

        .tg,
        .sel.burger {
            width: 34px;
            padding: 0;
            display: grid;
            place-items: center;
            font-size: 1rem
        }

        /* FIX: burger hidden on desktop (higher specificity than .tg,.burger) */
        .sel.burger {
            display: none
        }

        section {
            position: relative;
            z-index: 1;
            padding: 100px 0
        }

        .eye {
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--b)
        }

        .hd {
            max-width: 700px;
            margin-bottom: 44px
        }

        .hd h2 {
            font-size: clamp(2rem, 5vw, 3.6rem);
            margin: 12px 0
        }

        .btn {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 800;
            border: 1px solid var(--l);
            background: var(--s);
            color: var(--t);
            transition: .3s;
            position: relative;
            overflow: hidden
        }

        .btn.p {
            background: linear-gradient(110deg, var(--a), #5b8cff);
            color: #fff;
            border: 0;
            box-shadow: 0 14px 36px rgba(110, 96, 240, .4)
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03)
        }

        .btn.p:after {
            content: "";
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent);
            transform: skewX(-20deg);
            animation: shine 3s infinite
        }

        @keyframes shine {
            to {
                left: 130%
            }
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding-top: 130px;
            overflow: hidden
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .5;
            animation: drift 14s ease-in-out infinite alternate
        }

        .b1 {
            width: 360px;
            height: 360px;
            background: var(--a);
            top: 8%;
            left: 6%
        }

        .b2 {
            width: 320px;
            height: 320px;
            background: var(--b);
            bottom: 6%;
            right: 8%;
            animation-delay: -6s;
            opacity: .3
        }

        .b3 {
            width: 240px;
            height: 240px;
            background: var(--c);
            top: 40%;
            right: 30%;
            animation-delay: -3s;
            opacity: .25
        }

        @keyframes drift {
            to {
                transform: translate(60px, -50px) scale(1.2)
            }
        }

        .pill {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 7px 16px;
            border: 1px solid var(--l);
            border-radius: 99px;
            background: var(--s);
            font-size: .78rem;
            font-weight: 700;
            color: var(--m)
        }

        .pill i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--b);
            box-shadow: 0 0 0 0 var(--b);
            animation: pulse 2s infinite
        }

        @keyframes pulse {
            70% {
                box-shadow: 0 0 0 10px transparent
            }
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8.5vw, 6.6rem);
            margin: 26px auto;
            max-width: 980px
        }

        .hero p.sub {
            max-width: 600px;
            margin: 0 auto 34px;
            font-size: 1.1rem
        }

        .acts {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap
        }

        .rise {
            opacity: 0;
            transform: translateY(40px);
            animation: rise .9s cubic-bezier(.2, .8, .2, 1) forwards
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: none
            }
        }

        .floatc {
            position: absolute;
            padding: 12px 16px;
            border-radius: 16px;
            background: var(--s);
            border: 1px solid var(--l);
            font-weight: 800;
            font-size: .8rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
            animation: bob 5s ease-in-out infinite
        }

        @keyframes bob {
            50% {
                transform: translateY(-16px) rotate(2deg)
            }
        }

        .f1 {
            left: 6%;
            top: 38%
        }

        .f2 {
            right: 6%;
            top: 30%;
            animation-delay: -2s
        }

        .f3 {
            left: 14%;
            bottom: 12%;
            animation-delay: -3.5s
        }

        .mq {
            overflow: hidden;
            border-block: 1px solid var(--l);
            background: var(--s);
            padding: 18px 0;
            position: relative;
            z-index: 1
        }

        .mq div {
            display: flex;
            gap: 46px;
            width: max-content;
            animation: mq 28s linear infinite;
            font: 700 1.3rem "Space Grotesk";
            color: var(--m);
            white-space: nowrap
        }

        .mq span:nth-child(odd) {
            color: var(--t)
        }

        @keyframes mq {
            to {
                transform: translateX(-50%)
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px
        }

        .stat {
            padding: 28px;
            border-radius: 22px;
            background: var(--s);
            border: 1px solid var(--l);
            text-align: center
        }

        .stat b {
            display: block;
            font: 700 clamp(2rem, 4vw, 3.2rem) "Space Grotesk"
        }

        .stat span {
            font-size: .85rem;
            color: var(--m)
        }

        .bento {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px
        }

        .card {
            position: relative;
            padding: 28px;
            border-radius: 24px;
            background: var(--s);
            border: 1px solid var(--l);
            overflow: hidden;
            transition: transform .25s, border-color .3s;
            transform-style: preserve-3d
        }

        .card:hover {
            border-color: var(--a)
        }

        .card:before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(260px circle at var(--x, 50%) var(--y, 0), rgba(139, 124, 255, .22), transparent 70%);
            opacity: 0;
            transition: .3s
        }

        .card:hover:before {
            opacity: 1
        }

        .card>* {
            position: relative
        }

        .bento .card:nth-child(1) {
            grid-column: span 2;
            grid-row: span 2;
            background: linear-gradient(145deg, var(--s), var(--s2))
        }

        .bento .card:nth-child(4) {
            grid-column: span 2
        }

        .ico {
            font-size: 2rem;
            margin-bottom: 16px;
            display: inline-block;
            animation: bob 4s ease-in-out infinite
        }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 8px
        }

        .card p {
            font-size: .9rem
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 28px
        }

        .fl {
            padding: 9px 18px;
            border-radius: 99px;
            border: 1px solid var(--l);
            background: transparent;
            color: var(--m);
            font-weight: 700;
            font-size: .82rem;
            transition: .2s
        }

        .fl.on,
        .fl:hover {
            background: var(--t);
            color: var(--bg)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px
        }

        .pc {
            border-radius: 24px;
            background: var(--bg);
            border: 1px solid var(--l);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform .25s, box-shadow .3s, border-color .3s;
            transform-style: preserve-3d;
            color: inherit
        }

        .pc:hover {
            box-shadow: 0 30px 70px rgba(0, 0, 0, .35);
            border-color: var(--a)
        }

        .shot {
            position: relative;
            aspect-ratio: 16/10;
            overflow: hidden
        }

        .shot img,
        .shot video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            z-index: 2
        }

        .shot img {
            transition: transform 4s ease
        }

        .pc:hover .shot img {
            transform: scale(1.06)
        }

        .shot video {
            opacity: 0;
            transition: opacity .45s
        }

        .pc.play video {
            opacity: 1
        }

        .pc.play .shot img {
            transform: none
        }

        .mock {
            position: absolute;
            inset: 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .mock .bar {
            display: flex;
            gap: 5px
        }

        .mock .bar i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .5)
        }

        .mock .big {
            font-size: 3.2rem;
            margin: auto;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .4));
            animation: bob 4s ease-in-out infinite
        }

        .mock .ln {
            height: 8px;
            border-radius: 9px;
            background: rgba(255, 255, 255, .28)
        }

        .shot:after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(0, 0, 0, .45));
            z-index: 3;
            pointer-events: none
        }

        .chip {
            position: absolute;
            z-index: 4;
            left: 14px;
            bottom: 12px;
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #fff
        }

        .demo {
            position: absolute;
            z-index: 4;
            right: 12px;
            top: 12px;
            padding: 5px 11px;
            border-radius: 99px;
            font-size: .68rem;
            font-weight: 800;
            background: rgba(0, 0, 0, .6);
            color: #fff;
            backdrop-filter: blur(6px);
            display: none
        }

        .pc.hasv .demo {
            display: block
        }

        .pc.play .demo {
            display: none
        }

        .pb {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1
        }

        .pb small {
            font-size: .7rem;
            font-weight: 800;
            color: var(--b);
            letter-spacing: .12em
        }

        .pb h3 {
            font-size: 1.2rem;
            margin: 6px 0
        }

        .pb p {
            font-size: .86rem;
            flex: 1
        }

        .pb .go {
            margin-top: 16px;
            font-weight: 800;
            font-size: .85rem;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--l);
            padding-top: 12px
        }

        .pb .go .ar {
            transition: .3s;
            color: var(--b)
        }

        .pc:hover .go .ar {
            transform: translate(5px, -5px)
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px
        }

        .step {
            padding: 26px;
            border-radius: 22px;
            background: var(--s);
            border: 1px solid var(--l)
        }

        .step b {
            font: 700 3.4rem "Space Grotesk";
            -webkit-text-stroke: 1.5px var(--a);
            color: transparent;
            display: block;
            margin-bottom: 6px
        }

        .step h3 {
            font-size: 1.1rem;
            margin-bottom: 8px
        }

        .step p {
            font-size: .86rem
        }

        .cta {
            padding: 70px 40px;
            text-align: center;
            border-radius: 32px;
            background: linear-gradient(120deg, #5f50ea, #1f9aa6, #d34a9c);
            background-size: 200% 200%;
            animation: flow2 8s ease infinite;
            color: #fff
        }

        @keyframes flow2 {
            50% {
                background-position: 100% 50%
            }
        }

        .cta h2 {
            font-size: clamp(2rem, 5vw, 3.6rem);
            max-width: 760px;
            margin: 0 auto 14px
        }

        .cta p {
            color: #e8ecff;
            margin-bottom: 26px
        }

        .cta .btn {
            background: #fff;
            color: #241f55;
            border: 0
        }

        .cg {
            display: grid;
            grid-template-columns: .9fr 1.1fr;
            gap: 44px
        }

        .ci {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-top: 20px
        }

        .ci i {
            font-style: normal;
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: var(--s);
            border: 1px solid var(--l);
            flex: none
        }

        .ci span {
            display: block;
            font-size: .74rem;
            color: var(--m)
        }

        .ci b {
            word-break: break-word
        }

        form {
            padding: 28px;
            border-radius: 24px;
            background: var(--s);
            border: 1px solid var(--l)
        }

        .r {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        label {
            display: block;
            font-size: .76rem;
            font-weight: 800;
            margin: 0 0 6px
        }

        input,
        textarea,
        select.f {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid var(--l);
            background: var(--bg);
            color: var(--t);
            font: inherit;
            margin-bottom: 14px;
            outline: none;
            transition: .2s
        }

        input:focus,
        textarea:focus,
        select.f:focus {
            border-color: var(--a);
            box-shadow: 0 0 0 4px rgba(139, 124, 255, .18)
        }

        textarea {
            min-height: 110px;
            resize: vertical
        }

        form .btn {
            width: 100%;
            justify-content: center
        }

        .wa {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 60;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #25d366;
            display: grid;
            place-items: center;
            font-size: 1.6rem;
            box-shadow: 0 10px 30px rgba(37, 211, 102, .5);
            animation: pulse2 2.4s infinite
        }

        @keyframes pulse2 {
            70% {
                box-shadow: 0 0 0 18px rgba(37, 211, 102, 0)
            }
        }

        .rv {
            opacity: 0;
            transform: translateY(34px);
            transition: opacity .8s, transform .8s cubic-bezier(.2, .8, .2, 1)
        }

        .rv.v {
            opacity: 1;
            transform: none
        }

        .wgal {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px
        }

        .wcard {
            background: var(--bg);
            border: 1px solid var(--l);
            border-radius: 22px;
            overflow: hidden;
            min-width: 0;
            transition: transform .3s, border-color .3s
        }

        .wcard:hover {
            transform: translateY(-7px);
            border-color: var(--a)
        }

        .wimg {
            position: relative;
            height: 210px;
            display: grid;
            place-items: center;
            font-size: 3.4rem;
            background: linear-gradient(135deg, var(--s2), var(--a));
            overflow: hidden
        }

        .wimg img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .6s
        }

        .wcard:hover .wimg img {
            transform: scale(1.07)
        }

        .wcopy {
            padding: 19px
        }

        .wcopy .num {
            font: 700 .72rem "Space Grotesk";
            color: var(--b);
            letter-spacing: .12em
        }

        .wcopy h3 {
            font-size: 1.08rem;
            margin: 7px 0
        }

        .wcopy p {
            font-size: .86rem
        }

        .wnote {
            margin-top: 22px;
            padding: 20px 24px;
            border: 1px solid var(--l);
            background: var(--bg);
            border-radius: 18px;
            color: var(--m)
        }

        .wnote strong {
            color: var(--t)
        }

        .why {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px
        }

        .tech-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 12px
        }

        .tech {
            padding: 13px 20px;
            border: 1px solid var(--l);
            border-radius: 12px;
            background: var(--s);
            font-weight: 800;
            font-size: .86rem;
            transition: .3s
        }

        .tech:hover {
            transform: translateY(-4px);
            border-color: var(--a);
            color: var(--b)
        }

        .faq {
            max-width: 820px
        }

        .fq {
            border: 1px solid var(--l);
            border-radius: 16px;
            background: var(--s);
            margin-bottom: 12px;
            padding: 0 22px;
            transition: border-color .3s
        }

        .fq[open] {
            border-color: var(--a)
        }

        .fq summary {
            cursor: pointer;
            font-weight: 800;
            padding: 18px 0;
            list-style: none;
            display: flex;
            justify-content: space-between;
            gap: 12px
        }

        .fq summary::-webkit-details-marker {
            display: none
        }

        .fq summary:after {
            content: "+";
            color: var(--b);
            font-size: 1.5rem;
            line-height: 1;
            transition: .3s
        }

        .fq[open] summary:after {
            transform: rotate(45deg)
        }

        .fq p {
            padding-bottom: 18px;
            font-size: .92rem
        }

        .field-error {
            display: block;
